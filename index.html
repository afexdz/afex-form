<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AFEX Formation, sites pour écoles privées, e-learning et crèches</title>
<meta name="description" content="AFEX Formation : modèles de sites pour écoles privées, plateformes e-learning et crèches, par AFEX Digital.">
<meta name="theme-color" content="#2230D8">
<style>
:root { --paper: oklch(97.4% 0.005 275); --ink: oklch(17.9% 0.033 274.5); --ink-2: oklch(40% 0.04 274); --accent: oklch(44.3% 0.246 267.9); --accent-ink: oklch(98.5% 0.006 268); --font: system-ui, -apple-system, "Segoe UI", sans-serif; }
html, body { overflow-x: clip; }
body { margin: 0; min-height: 100svh; display: grid; place-items: center; padding: 24px; box-sizing: border-box; background: var(--paper); color: var(--ink); font-family: var(--font); }
main { max-width: 36rem; }
h1 { margin: 0 0 16px; font-size: clamp(2rem, 6vw, 3.5rem); line-height: 1.05; letter-spacing: -0.03em; }
p { margin: 0 0 24px; color: var(--ink-2); font-size: 1.125rem; line-height: 1.55; }
a { display: inline-flex; align-items: center; min-height: 48px; padding: 0 24px; border-radius: 6px; background: var(--accent); color: var(--accent-ink); font-weight: 600; text-decoration: none; }
a:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
</style>
</head>
<body>
<main>
  <h1>Sites pour écoles privées, e-learning et crèches.</h1>
  <p>Le catalogue AFEX Formation arrive bientôt. En attendant, découvrez nos réalisations.</p>
  <a href="https://afexad.app/#realisations">Voir les réalisations AFEX Digital</a>
</main>
</body>
</html>
